[project]
name = "beacon"
version = "0.1.0"
description = "Massachusetts Legislature committee compliance tracker"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pypdf>=7.1.1",
    "starlette>=1.10.0",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
beacon = "beacon.orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beacon"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
